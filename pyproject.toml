[build-system]
requires = ["setuptools>=75"]
build-backend = "setuptools.build_meta"

[project]
name = "smithsonian-rag"
version = "0.1.0"
description = "Production-oriented multimodal RAG system for Smithsonian Open Access collections."
readme = "README.md"
requires-python = ">=3.12"
license = { text = "MIT" }
authors = []
dependencies = []

[project.optional-dependencies]
dev = [
    "pytest>=8.0",
]

[tool.setuptools.packages.find]
where = ["src"]

[tool.pytest.ini_options]
addopts = "-q"
testpaths = ["tests"]
pythonpath = ["src"]
